<div class="project-settings">
  <button id="close-btn" class="close-btn">×</button>
  <h2>Project Settings</h2>
  
  <section>
    <label for="project-name">Name:</label>
    <input type="text" id="project-name" placeholder="Project name" />
  </section>

  <section>
    <label>Canvas size:</label>
    <div class="canvas-inputs">
      <input type="number" id="canvas-width" placeholder="width" value="800" />
      <span>×</span>
      <input type="number" id="canvas-height" placeholder="height" value="600" />
    </div>
  </section>

  <section>
    <label for="fps-value">Frames per second:</label>
    <div class="fps-input">
      <input type="number" id="fps-value" value="12" min="1" max="60" />
      <span>fps</span>
    </div>
  </section>

  <button id="make-project-btn" class="make-project">New Project</button>
</div>
