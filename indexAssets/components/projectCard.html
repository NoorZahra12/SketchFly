<style>
    .project-card,
    .project-card * {
        box-sizing: border-box;
    }

    .project-card {
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        align-items: flex-start;
        justify-content: flex-start;
        width: 320px;
        min-width: 200px;
        max-width: 360px;
        position: relative;
        overflow: hidden;
        background: rgba(16, 26, 52, 0.5);
        box-shadow:
            0 18px 40px rgba(6, 14, 40, 0.45),
            inset 0 1px 0 rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(22px) saturate(150%);
        -webkit-backdrop-filter: blur(22px) saturate(150%);
    }

    body:not(.dark) .project-card {
        background: rgba(255, 255, 255, 0.6);
        border: 1px solid rgba(120, 140, 200, 0.18);
        box-shadow:
            0 14px 30px rgba(90, 120, 180, 0.16),
            inset 0 1px 0 rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(16px) saturate(120%);
        -webkit-backdrop-filter: blur(16px) saturate(120%);
    }
    
    .thumbnail {
        background: #d9d9d9;
        border-radius: 4px;
        align-self: stretch;
        flex-shrink: 0;
        height: 150px;
        position: relative;
        overflow: hidden;
    }

    .thumbnail img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
    }

    .thumbnail:hover{
        cursor: pointer;
    }
    
    .infos {
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
        justify-content: center;
        align-self: stretch;
        flex-shrink: 0;
        position: relative;
    }

    .main-info {
        display: flex;
        flex-direction: row;
        gap: 0px;
        align-items: flex-start;
        justify-content: flex-start;
        align-self: stretch;
        flex-shrink: 0;
        position: relative;
    }

    .project-name {
        color: var(--text);
        text-align: left;
        font-family: var(--body-base-font-family, "Inter-Regular", sans-serif);
        font-size: var(--body-base-font-size, 16px);
        line-height: var(--body-base-line-height, 140%);
        font-weight: var(--body-base-font-weight, 400);
        position: relative;
        flex: 1;
    }

    .starred {
        border-radius: 0px;
        flex-shrink: 0;
        width: 22px;
        height: 22px;
        position: relative;
        overflow: visible;
        aspect-ratio: 1;
        color: var(--text);
    }

    .starred svg {
        width: 100%;
        height: 100%;
        color: inherit;
        /* inherits from .starred */
    }

    .round {
        border-radius: 28px;
        border-style: solid;
        border-color: transparent;
        border-width: 1px;
        flex-shrink: 0;
        width: 22px;
        height: 22px;
        position: relative;
    }

    .dots3 {
        color: var(--text);
        text-align: center;
        font-family: "Roboto-Bold", sans-serif;
        font-size: 24px;
        line-height: 16px;
        letter-spacing: 0.5px;
        font-weight: 700;
        position: absolute;
        left: 0px;
        top: 0px;
        width: 22px;
        height: 22px;
    }

    .extra-info {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        align-self: stretch;
        flex-shrink: 0;
        height: 20px;
        position: relative;
    }
</style>

<div class="project-card">
    <div class="thumbnail" aria-label="Project thumbnail"></div>
    <div class="infos">
        <div class="main-info">
            <div class="project-name">Project Name</div>
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M8.52466 0.808105C8.69546 0.397457 9.27769 0.39746 9.44849 0.808105L11.1995 5.01904C11.4155 5.53839 11.9044 5.89402 12.4651 5.93896L17.012 6.30322C17.455 6.33901 17.6346 6.89187 17.2971 7.18115L13.8333 10.1489C13.4061 10.5149 13.2193 11.0891 13.3499 11.6362L14.4084 16.0728C14.5113 16.505 14.0407 16.8469 13.6614 16.6157L9.7688 14.2378C9.28877 13.9446 8.68437 13.9446 8.20435 14.2378L4.31177 16.6157C3.93239 16.8469 3.46186 16.505 3.5647 16.0728L4.62329 11.6362C4.7538 11.0891 4.56708 10.5149 4.13989 10.1489L0.676025 7.18115C0.338502 6.89186 0.518153 6.33901 0.961182 6.30322L5.50806 5.93896C6.06874 5.89402 6.55767 5.5384 6.77368 5.01904L8.52466 0.808105Z"
                    stroke="currentColor" />
            </svg>
            <div class="round">
                <div class="dots3">⋮</div>
            </div>
        </div>
        <div class="extra-info">
            <div class="currentfpsIndicator">fps</div>
            <div class="timedisplay">00:00</div>
        </div>
    </div>
</div>
