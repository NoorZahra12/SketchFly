<!DOCTYPE html>
<html lang="en">

<head>
    <title>Untitled project</title>
    <link rel="stylesheet" href="style/editor.css" />
</head>

<header>
    <!-- everything below is shown in icons buttons only and when u hover it, it can show the text too -->
    <nav>
        <section class="nav-left-basic-functions">
            <button class="icon-btn" title="Home"><a href="./index.html">🏠</a></button>
            <button title="ProjectSettings">⚙️</button>
            <button class="icon-btn" title="Undo">↶</button>
            <button class="icon-btn" title="Redo">↷</button>
            <button class="icon-btn" title="Cut">&#9986;</button>
            <button class="icon-btn" title="Copy">📋︎ </button>
            <button class="icon-btn" title="Paste">📄︎</button>
            <button class="icon-btn" title="Delete">🗑️</button>
        </section>

        <!-- editing tool bar btn -->
        <section class="frame-editing-tools">
            <!-- <button class="icon-btn" title="Expand Tools">◀</button> -->
            <!-- <button class="icon-btn" title="Selector">◯</button> -->
            <!-- <button class="icon-btn" title="MagicWand">🪄</button> -->
            <!-- <button class="icon-btn" title="Transform">⤡</button> -->
            <!-- <button class="icon-btn" title="Bucket">🪣</button> -->
            <!-- <button class="icon-btn" title="Guides">⊞</button> -->
            <!-- <button class="icon-btn" title="Shapes">■</button> -->
            <!-- <button class="icon-btn" title="Text">T</button> -->
            <button class="icon-btn" title="Onion" style="background-color: black;">👻</button>
            <!-- layer -->
            <!-- <button class="icon-btn" title="Layers">🗂️</button> -->
        </section>
    </nav>
</header>

<main>
    <aside>
        <button title="Brush" id="pencil_tool">✏️</button>
        <button title="Eraser" id="eraser_tool">🧽</button>
        <input type="color" id="colorPicker" value="#000000">
        <button id="zoomReset" title="Reset Zoom">100%</button>
        <!-- <button title="Hand Tool" id="hand_tool">✋</button> -->

    </aside>
    <!-- rendering area   -->
    <div class="containerview">
        <canvas id="canvas">
            <!-- the size of canvas depends on the size taken from project form -->
        </canvas>
    </div>
</main>

<footer>
    <section class="video-settings">
        <article class="playControls">
            <button title="Rewind"><</button>
                    <button title="Play / Pause">▷</button>
                    <button title="Forward">></button>
        </article>
        <article for="timedisplay">
            <label for="currentTime">00:00/00:00</label>
        </article>
        <!-- <article class="fpsZoomControls">
            <button>-</button>
            <label for="">100%</label>
            <button>+</button>
        </article> -->
    </section>
    <div class="editorContainer">
        <!-- <section class="assetPanel">
            <button>mode</button>
            <button>import</button>
            <button>mp3</button>
            <button>mp4</button>
            <button>audio</button>
        </section> -->
        <section class="animationContainer">
            <div class="currentfpsIndicator"></div>
            <section class="fpsScale">
            </section>
            <section class="fpsGridContainer"></section>
        </section>
        <section class="editingPanel">
            <button title="Add Layers">add layer</button>
            <!-- <button title="Add Frames">add frames</button> -->
            <button title="copy clip">copy clip</button>
            <button title="paste clip">paste clip</button>
            <button title="delete clip">delete clip</button>
            <!-- <button title="delete clip">split clip</button> -->
        </section>
    </div>
</footer>

<!-- Scripts -->
<script type="module" src="js/editor/main.js"></script>
</body>

</html>
